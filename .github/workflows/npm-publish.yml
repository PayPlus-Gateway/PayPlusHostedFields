# Builds dist/ and publishes the package to npm when a v* tag is pushed or a GitHub release is created.
#
# Auth uses an npm granular access token stored as the NPM_TOKEN repo secret.
# npm caps write tokens at 90 days, so this secret must be rotated periodically.
# To stop rotating it, switch to Trusted Publishing (OIDC): https://docs.npmjs.com/trusted-publishers/
#
# See: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish to npm

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:webpack

      - name: Verify build output
        run: |
          test -f dist/payplus-hosted-fields.min.js || {
            echo "::error::dist/payplus-hosted-fields.min.js was not produced by the build"
            exit 1
          }
          ls -l dist

      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::warning::package.json version ($PKG_VERSION) does not match release tag ($GITHUB_REF_NAME)"
          fi

      - name: Check version matches pushed tag
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match pushed tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Check npm authentication
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is empty or not set in this repository"
            exit 1
          fi
          npm whoami || {
            echo "::error::npm rejected NPM_TOKEN (expired, revoked, or read-only). A bad token makes 'npm publish' fail with a misleading 404."
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check version is not already published
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::error::${PKG_NAME}@${PKG_VERSION} is already published. Bump the version in package.json."
            exit 1
          fi
          echo "${PKG_NAME}@${PKG_VERSION} is not yet published"

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
